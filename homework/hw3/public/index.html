<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeadlineMate 課表與作業提醒</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1f2430; --muted:#6b7280; --line:#e3e6ee; --main:#4f7cff;
          --overdue:#e03131; --today:#f76707; --soon:#f59f00; --week:#4f7cff; --later:#868e96; --done:#2b8a3e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161c; --card:#1d2029; --text:#e8eaf0; --muted:#9aa1b1; --line:#2c303c; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; }
  header h1 span { color:var(--main); }
  .tabs { display:flex; gap:4px; flex:1; }
  .tabs button { background:none; color:var(--muted); border:0; padding:8px 14px; border-radius:8px; font-size:15px; cursor:pointer; }
  .tabs button.on { background:var(--main); color:#fff; }
  .clock { color:var(--muted); font-variant-numeric:tabular-nums; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:16px; }
  .stat { font-size:32px; font-weight:bold; }
  .muted { color:var(--muted); font-size:13px; }
  .quick { display:flex; gap:8px; }
  .quick input { flex:1; font-size:16px; padding:10px 12px; }
  input, select, textarea { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:14px; font-family:inherit; }
  button.primary, button.btn { background:var(--main); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:14px; }
  button.ghost { background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:4px 10px; cursor:pointer; }
  .hw { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .hw:last-child { border-bottom:0; }
  .hw .bar { width:6px; align-self:stretch; border-radius:3px; }
  .hw .info { flex:1; min-width:0; }
  .hw .title { font-weight:bold; }
  .hw.isdone .title { text-decoration:line-through; color:var(--muted); }
  .pill { font-size:12px; padding:2px 8px; border-radius:10px; color:#fff; white-space:nowrap; }
  .u-overdue { background:var(--overdue); } .u-today { background:var(--today); } .u-soon { background:var(--soon); }
  .u-week { background:var(--week); } .u-later { background:var(--later); } .u-done { background:var(--done); }
  table.tt { width:100%; border-collapse:collapse; table-layout:fixed; }
  table.tt th, table.tt td { border:1px solid var(--line); padding:4px; font-size:12px; text-align:center; height:46px; }
  table.tt th { background:var(--bg); }
  .cell { border-radius:6px; color:#fff; padding:4px; height:100%; display:flex; flex-direction:column; justify-content:center; cursor:pointer; }
  .cell .dot { background:#fff; color:#000; border-radius:8px; font-size:11px; padding:0 5px; margin-top:2px; align-self:center; }
  .form { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; align-items:center; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:8px; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; }
  .load { display:flex; align-items:flex-end; gap:10px; height:90px; }
  .load div { flex:1; text-align:center; font-size:12px; color:var(--muted); }
  .load div i { display:block; background:var(--main); border-radius:4px 4px 0 0; margin-bottom:4px; min-height:2px; }
  .filters button { margin-right:4px; }
  .filters button.on { background:var(--main); color:#fff; border-color:var(--main); }
  @media (max-width:640px) { table.tt th, table.tt td { font-size:10px; height:38px; } .tabs { order:3; width:100%; } }
</style>
</head>
<body>
<header>
  <h1>📅 Deadline<span>Mate</span></h1>
  <div class="tabs" id="tabs">
    <button data-v="dash" class="on">總覽</button><button data-v="table">課表</button>
    <button data-v="hw">作業</button><button data-v="set">設定</button>
  </div>
  <span class="clock" id="clock"></span>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
const DAYS = ["","一","二","三","四","五","六","日"];
const ULABEL = {overdue:"已逾期", today:"24 小時內", soon:"3 天內", week:"7 天內", later:"之後", done:"完成"};
let state = { courses:[], hws:[], dash:null, view:"dash", filter:"pending", periods:{} };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2200); }
async function api(method, url, data) {
  const r = await fetch("/api/" + url, { method, headers:{"Content-Type":"application/json"}, body: data ? JSON.stringify(data) : undefined });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const fmtDue = s => { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}（${DAYS[d.getDay()||7]}）${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

async function load() {
  [state.dash, state.courses, state.hws] = await Promise.all([api("GET","dashboard"), api("GET","courses"), api("GET","assignments")]);
  state.periods = state.dash.periods;
  render();
  notifyCheck();
}

function render() { document.getElementById("view").innerHTML = VIEWS[state.view](); }
document.getElementById("tabs").onclick = e => {
  if (!e.target.dataset.v) return;
  state.view = e.target.dataset.v;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === e.target));
  render();
};

function hwRow(a) {
  return `<div class="hw ${a.done ? "isdone" : ""}" data-testid="hw-${a.id}">
    <div class="bar" style="background:${a.color || "#adb5bd"}"></div>
    <input type="checkbox" ${a.done ? "checked" : ""} onchange="toggleDone(${a.id}, this.checked)" aria-label="完成">
    <div class="info"><div class="title">${esc(a.title)} ${"❗".repeat(a.priority > 2 ? 1 : 0)}</div>
      <div class="muted">${esc(a.course_name || "未分類")} · ${fmtDue(a.due)} · ${a.remaining}</div>
      ${a.note ? `<div class="muted">📝 ${esc(a.note)}</div>` : ""}</div>
    <span class="pill u-${a.urgency}">${ULABEL[a.urgency]}</span>
    <button class="ghost" onclick="delHw(${a.id})" title="刪除">✕</button></div>`;
}

const VIEWS = {
  dash() {
    const d = state.dash, nc = d.next_class, max = Math.max(1, ...d.weekly_load.map(w => w.count));
    return `
    <div class="card"><div class="quick">
      <input id="quick" placeholder="快速新增：軟工 HW3 11/15 23:59、資結 lab5 下週三、網頁 作業2 明天" onkeydown="event.key==='Enter'&&quickAdd()">
      <button class="primary" onclick="quickAdd()">新增</button></div>
      <div class="muted" style="margin-top:6px">格式：課名(可縮寫) 作業名稱 日期 [時間]。日期可用 11/15、明天、後天、週五、下週三、3天後</div></div>
    <div class="grid">
      <div class="card"><h3>⏰ ${nc && nc.ongoing ? "正在上課" : "下一堂課"}</h3>
        ${nc ? `<div class="stat" style="font-size:22px;color:${nc.color}">${esc(nc.name)}</div>
          <div class="muted">${fmtDue(nc.start)} ~ ${nc.end.slice(11)} · ${esc(nc.room || "")}</div>` : `<div class="muted">這週沒有課 🎉</div>`}</div>
      <div class="card"><h3>📌 待完成</h3><div class="stat">${d.stats.pending}</div>
        <div class="muted"><span style="color:var(--overdue)">逾期 ${d.stats.overdue}</span> · <span style="color:var(--today)">24h 內 ${d.stats.due_24h}</span> · 已完成 ${d.stats.done}</div></div>
      <div class="card"><h3>📊 未來四週作業量</h3><div class="load">
        ${d.weekly_load.map((w,i) => `<div><i style="height:${w.count/max*60}px"></i>${["本週","下週","+2週","+3週"][i]}<br>${w.count} 份</div>`).join("")}</div></div>
    </div>
    <div class="grid">
      <div class="card"><h3>🔥 即將截止</h3>${d.upcoming.length ? d.upcoming.map(hwRow).join("") : `<div class="muted">一週內沒有作業要交</div>`}</div>
      <div class="card"><h3>📚 今天的課（週${DAYS[new Date(d.now).getDay()||7]}）</h3>
        ${d.today.length ? d.today.map(c => `<div class="hw"><div class="bar" style="background:${c.color}"></div><div class="info">
          <div class="title">${esc(c.name)}</div><div class="muted">第 ${c.start_period}-${c.end_period} 節 · ${state.periods[c.start_period][0]}~${state.periods[c.end_period][1]} · ${esc(c.room||"")}</div></div></div>`).join("")
          : `<div class="muted">今天沒課</div>`}</div>
    </div>`;
  },
  table() {
    let rows = "";
    const pending = state.hws.filter(a => !a.done);
    for (let p = 1; p <= 10; p++) {
      rows += `<tr><th>${p}<br><span class="muted">${state.periods[p][0]}</span></th>`;
      for (let d = 1; d <= 5; d++) {
        const c = state.courses.find(c => c.day === d && c.start_period === p);
        const inside = state.courses.find(c => c.day === d && c.start_period < p && p <= c.end_period);
        if (inside) continue;
        if (c) {
          const n = pending.filter(a => a.course_id === c.id).length;
          rows += `<td rowspan="${c.end_period - c.start_period + 1}"><div class="cell" style="background:${c.color}" onclick="editCourse(${c.id})">
            <b>${esc(c.name)}</b><span>${esc(c.room||"")}</span>${n ? `<span class="dot">${n} 份作業</span>` : ""}</div></td>`;
        } else rows += "<td></td>";
      }
      rows += "</tr>";
    }
    return `<div class="card"><h3>我的課表 <span class="muted">（點課程可編輯）</span></h3>
      <table class="tt"><tr><th style="width:60px">節</th>${[1,2,3,4,5].map(d=>`<th>週${DAYS[d]}</th>`).join("")}</tr>${rows}</table></div>
      <div class="card"><h3 id="cformTitle">新增課程</h3><div class="form">
        <input id="c_name" placeholder="課名"><input id="c_code" placeholder="課號"><input id="c_teacher" placeholder="老師"><input id="c_room" placeholder="教室">
        <select id="c_day">${[1,2,3,4,5,6,7].map(d=>`<option value="${d}">週${DAYS[d]}</option>`).join("")}</select>
        <select id="c_start">${[...Array(10)].map((_,i)=>`<option>${i+1}</option>`).join("")}</select>
        <select id="c_end">${[...Array(10)].map((_,i)=>`<option ${i==2?"selected":""}>${i+1}</option>`).join("")}</select>
        <input id="c_color" type="color" value="#4f7cff">
        <button class="btn" onclick="saveCourse()">儲存</button>
        <button class="ghost" id="c_del" style="display:none" onclick="delCourse()">刪除課程</button>
        <input type="hidden" id="c_id"></div></div>`;
  },
  hw() {
    const f = state.filter;
    const list = state.hws.filter(a => f === "all" || (f === "done" ? a.done : !a.done));
    return `<div class="card"><h3>新增作業</h3><div class="form">
        <select id="h_course"><option value="">（未分類）</option>${state.courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
        <input id="h_title" placeholder="作業名稱"><input id="h_due" type="datetime-local">
        <select id="h_pri"><option value="1">低</option><option value="2" selected>中</option><option value="3">高</option></select>
        <input id="h_note" placeholder="備註"><button class="btn" onclick="addHw()">新增</button></div></div>
      <div class="card"><div class="filters">
        ${[["pending","未完成"],["done","已完成"],["all","全部"]].map(([k,t]) => `<button class="ghost ${f===k?"on":""}" onclick="state.filter='${k}';render()">${t}</button>`).join("")}</div>
        ${list.length ? list.map(hwRow).join("") : `<p class="muted">沒有作業</p>`}</div>`;
  },
  set() {
    const url = location.origin + "/calendar.ics";
    return `<div class="card"><h3>📆 匯出到 Google 日曆 / 手機行事曆</h3>
        <p>訂閱網址：<code>${url}</code> <button class="ghost" onclick="navigator.clipboard.writeText('${url}');toast('已複製')">複製</button></p>
        <p class="muted">課程會依學期開始日每週重複 18 週；每份作業在截止前 1 天、1 小時提醒。</p>
        <a href="/calendar.ics" download><button class="btn">下載 .ics</button></a></div>
      <div class="card"><h3>學期開始日</h3><input type="date" id="sem"> <button class="btn" onclick="saveSem()">儲存</button></div>
      <div class="card"><h3>🔔 瀏覽器通知</h3><p class="muted">開著這個網頁時，作業剩 24 小時、1 小時會跳通知。目前狀態：<b>${"Notification" in window ? Notification.permission : "不支援"}</b></p>
        <button class="btn" onclick="Notification.requestPermission().then(render)">允許通知</button></div>`;
  },
};

// ---------- 動作
async function quickAdd() {
  const el = document.getElementById("quick");
  try { const r = await api("POST","quick",{text: el.value}); toast(`已新增「${r.title}」，截止 ${fmtDue(r.due)}`); el.value = ""; load(); }
  catch (e) { toast("❌ " + e.message); }
}
async function toggleDone(id, done) { await api("PUT","assignments/"+id,{done}); toast(done ? "完成！👏" : "已改回未完成"); load(); }
async function delHw(id) { if (confirm("刪除這份作業？")) { await api("DELETE","assignments/"+id); load(); } }
async function addHw() {
  try { await api("POST","assignments",{course_id: h_course.value || null, title:h_title.value, due:h_due.value, priority:+h_pri.value, note:h_note.value});
        toast("已新增"); load(); } catch(e) { toast("❌ " + e.message); }
}
function editCourse(id) {
  const c = state.courses.find(c => c.id === id);
  for (const k of ["name","code","teacher","room","day","color"]) document.getElementById("c_"+k).value = c[k] ?? "";
  c_start.value = c.start_period; c_end.value = c.end_period; c_id.value = id;
  cformTitle.textContent = "編輯課程：" + c.name; c_del.style.display = "";
  c_name.scrollIntoView({behavior:"smooth"});
}
async function saveCourse() {
  const id = c_id.value;
  const data = {name:c_name.value, code:c_code.value, teacher:c_teacher.value, room:c_room.value, day:+c_day.value,
                start_period:+c_start.value, end_period:+c_end.value, color:c_color.value};
  try { await api(id ? "PUT" : "POST", "courses" + (id ? "/"+id : ""), data); toast("已儲存"); load(); }
  catch (e) {
    if (e.message.includes("衝堂") && confirm(e.message + "，仍要儲存嗎？")) {
      await api(id ? "PUT" : "POST", "courses" + (id ? "/"+id : "") + "?force=1", data); load();
    } else toast("❌ " + e.message);
  }
}
async function delCourse() { if (confirm("刪除課程？（作業會保留為未分類）")) { await api("DELETE","courses/"+c_id.value); load(); } }
async function saveSem() { await api("PUT","settings",{semester_start: sem.value}); toast("已儲存"); }

// ---------- 通知
function notifyCheck() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  let sent = {};
  try { sent = JSON.parse(localStorage.getItem("dm-notified") || "{}"); } catch {}
  const now = Date.now();
  for (const a of state.hws) {
    if (a.done) continue;
    const left = new Date(a.due) - now;
    for (const [lvl, ms, txt] of [["1h", 3600e3, "1 小時內"], ["24h", 86400e3, "24 小時內"]]) {
      const key = a.id + "-" + lvl;
      if (left > 0 && left <= ms && !sent[key]) {
        new Notification(`⏰ ${a.title} ${txt}截止`, { body: `${a.course_name || ""} ${fmtDue(a.due)}` });
        sent[key] = 1; break;
      }
    }
  }
  try { localStorage.setItem("dm-notified", JSON.stringify(sent)); } catch {}
}

setInterval(() => { document.getElementById("clock").textContent = new Date().toLocaleString("zh-TW", {hour12:false}); }, 1000);
setInterval(load, 60_000);
load().then(() => api("GET","settings").then(s => { window._sem = s.semester_start; }));
new MutationObserver(() => { const s = document.getElementById("sem"); if (s && !s.value && window._sem) s.value = window._sem; })
  .observe(document.getElementById("view"), {childList:true});
</script>
</body>
</html>

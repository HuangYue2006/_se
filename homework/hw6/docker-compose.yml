# 第 6 週：nginx + FastAPI + PostgreSQL 微服務
# 啟動：docker compose up -d --build   →  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    container_name: hw6-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-board}
      POSTGRES_USER: ${POSTGRES_USER:-board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-board_dev_pw}
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei                          # 讓 NOW() 用台灣時間，和網頁輸入的時間一致
    volumes:
      - pgdata:/var/lib/postgresql/data          # 具名 volume：容器刪掉資料還在
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # 第一次啟動時自動建表
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    build: ./api
    container_name: hw6-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-board}:${POSTGRES_PASSWORD:-board_dev_pw}@db:5432/${POSTGRES_DB:-board}
    depends_on:
      db:
        condition: service_healthy               # 等資料庫真的可以連線才啟動
    networks: [backend]
    # 不對外開 port，只能透過 nginx 進來

  nginx:
    image: nginx:1.27-alpine
    container_name: hw6-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on: [api]
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
